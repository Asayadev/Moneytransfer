name: Build HTML to Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Build APK with Cordova
      run: |
        npm install -g cordova
        cordova create myApp com.example.app MyApp
        cp -r * myApp/www/ 2>/dev/null || true
        cd myApp
        cordova platform add android
        cordova build android --release -- --gradleArg=-PcdvBuildMultipleApks=false

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Moneytransfer-APK
        path: myApp/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
