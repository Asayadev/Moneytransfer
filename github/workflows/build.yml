name: Build HTML to Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova App & Build APK
      run: |
        cordova create myApp com.example.app MyApp
        cp -r * myApp/www/ 2>/dev/null || true
        cd myApp
        cordova platform add android
        cordova build android --verbose

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: HTML-App-APK
        path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
